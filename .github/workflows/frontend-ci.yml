name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vocabulary-web

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker-image:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=vocabulary-web
          cache-to: type=gha,mode=max,scope=vocabulary-web
      - name: Verify published manifest
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" > manifest.txt
          grep --fixed-strings "linux/amd64" manifest.txt
          grep --fixed-strings "linux/arm64" manifest.txt
      - name: Smoke-test published image
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name vocabulary-web-smoke --publish 8080:80 "$IMAGE_REF"
          for attempt in {1..10}; do
            if response="$(curl --fail --silent http://127.0.0.1:8080/)" && grep --quiet "Vocabulary Manager" <<<"$response"; then
              exit 0
            fi
            sleep 1
          done
          docker logs vocabulary-web-smoke
          exit 1
      - name: Clean up smoke-test container
        if: always() && github.event_name == 'push'
        run: docker rm --force vocabulary-web-smoke
